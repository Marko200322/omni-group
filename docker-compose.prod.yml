# Produkcija — VPS: docker compose -f docker-compose.prod.yml up -d
# Preduslov: .env u atina-platform/atina/.env + apps/omnigroup-web/.env.production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-atina_saas_db}
      POSTGRES_USER: ${DB_USER:-atina_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-atina_user}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [omni_net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [omni_net]

  migrate:
    build:
      context: ./atina-platform/atina
      dockerfile: Dockerfile
      target: builder
    env_file:
      - ./atina-platform/atina/.env.docker.prod
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
    command: ['npx', 'ts-node', 'src/database/migrate.ts']
    depends_on:
      postgres:
        condition: service_healthy
    networks: [omni_net]
    profiles: [setup]

  seed:
    build:
      context: ./atina-platform/atina
      dockerfile: Dockerfile
      target: builder
    env_file:
      - ./atina-platform/atina/.env.docker.prod
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
    command: ['npx', 'ts-node', 'src/database/seed.ts']
    depends_on:
      postgres:
        condition: service_healthy
    networks: [omni_net]
    profiles: [setup]

  atina-api:
    build:
      context: ./atina-platform/atina
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    # NOTE (cold-start hardening): the autonomy scheduler in this service is the
    # RAM spiker that starves `web`. Once you know the VPS total RAM, cap it here
    # so web's reservation is actually protected, e.g. on a 2GB box:
    #   mem_limit: 1200m
    # Left uncapped by default to avoid throttling the backend unexpectedly.
    env_file:
      - ./atina-platform/atina/.env.docker.prod
    environment:
      NODE_ENV: production
      APP_NODE_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
      AUTONOMY_ENABLED: ${AUTONOMY_ENABLED:-true}
      AUTONOMY_AUTO_START_SCHEDULER: ${AUTONOMY_AUTO_START_SCHEDULER:-true}
      AUTONOMY_ROLLOUT_SEGMENT: ${AUTONOMY_ROLLOUT_SEGMENT:-freelance}
      AUTONOMY_EVOLUTION_CODE_EDIT: ${AUTONOMY_EVOLUTION_CODE_EDIT:-false}
      AUTONOMY_GIT_REPO_PATH: ${AUTONOMY_GIT_REPO_PATH:-/repo}
      PHASE: ${PHASE:-v2}
      FORGE_VAULT_PATH: /var/omni/forge/vault.db
    volumes:
      - forge_data:/var/omni/forge
      - ${AUTONOMY_REPO_MOUNT:-./}:/repo:ro
    ports:
      - '${ATINA_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [omni_net]

  web:
    build:
      context: ./apps/omnigroup-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_FACTORY_PHASE: ${NEXT_PUBLIC_FACTORY_PHASE:-M3}
        NEXT_PUBLIC_FACTORY_PHASE_AUTO: ${NEXT_PUBLIC_FACTORY_PHASE_AUTO:-false}
        NEXT_PUBLIC_PROD_MODE: ${NEXT_PUBLIC_PROD_MODE:-full}
        NEXT_PUBLIC_MONTHLY_BUDGET_EUR: ${NEXT_PUBLIC_MONTHLY_BUDGET_EUR:-550}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://omnigrouptech.com}
        NEXT_PUBLIC_ATINA_API_BASE: ${NEXT_PUBLIC_ATINA_API_BASE:-https://api.omnigrouptech.com}
        NEXT_PUBLIC_FOUNDING_CLIENT_PROMO: ${NEXT_PUBLIC_FOUNDING_CLIENT_PROMO:-false}
        NEXT_PUBLIC_FOUNDING_CLIENT_DISCOUNT_PCT: ${NEXT_PUBLIC_FOUNDING_CLIENT_DISCOUNT_PCT:-15}
        NEXT_PUBLIC_FOUNDING_CLIENT_MAX_SLOTS: ${NEXT_PUBLIC_FOUNDING_CLIENT_MAX_SLOTS:-50}
        NEXT_PUBLIC_FOUNDING_CLIENT_LOCK_MONTHS: ${NEXT_PUBLIC_FOUNDING_CLIENT_LOCK_MONTHS:-12}
        NEXT_PUBLIC_REGISTRATION_ENABLED: ${NEXT_PUBLIC_REGISTRATION_ENABLED:-false}
    restart: unless-stopped
    env_file:
      - ./apps/omnigroup-web/.env.production
    environment:
      NODE_ENV: production
      UPLOAD_STORAGE: local
      UPLOAD_DIR: /var/omni/uploads
      # Keep the web heap bounded so it fits under mem_limit below and never
      # competes unbounded with atina-api. Matches the Dockerfile default.
      NODE_OPTIONS: --max-old-space-size=512
    volumes:
      - upload_data:/var/omni/uploads
    ports:
      - '${WEB_PORT:-3010}:3000'
    # Memory guardrails (defense-in-depth only). NOTE: the "cold start" we chased
    # was NOT memory — the host has 48GB free, web uses <100MB, 0 OOM kills, 0
    # restarts. Root cause was a dead AAAA/IPv6 DNS record black-holing clients.
    # Keep a floor so web stays warm; keep the ceiling generous so a real traffic
    # spike is never OOM-killed on this large host.
    mem_reservation: 256m
    mem_limit: 1536m
    depends_on:
      atina-api:
        condition: service_healthy
    healthcheck:
      # Probe the light /api/health route, not the heavy marketing homepage.
      # The homepage cold-render can exceed the 10s timeout and mark the
      # container unhealthy while it is actually still booting.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks: [omni_net]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      API_DOMAIN: ${API_DOMAIN:-localhost}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - atina-api
    networks: [omni_net]
    # DEPLOY FOOTGUN: caddy is the ONLY TLS/HTTPS entrypoint but sits behind the
    # `tls` profile, so a plain `docker compose up -d` starts web+api WITHOUT the
    # reverse proxy (no HTTPS). Always bring it up explicitly:
    #   docker compose -f docker-compose.prod.yml --profile tls up -d caddy
    # (scripts/deploy-to-vps.ps1 already does this — only bare manual `up` is at risk.)
    profiles: [tls]

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:
  upload_data:
  forge_data:

networks:
  omni_net:
    driver: bridge
