apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: atina-saas
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: prod-atina-saas
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
